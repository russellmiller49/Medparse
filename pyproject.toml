[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medparse-api"
version = "0.1.0"
description = "FastAPI wrapper around the Medparse document extraction pipeline"
requires-python = ">=3.10,<3.12"
authors = [
  { name = "Medparse" }
]
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.8.2",
  "pydantic-settings==2.4.0",
  "python-multipart==0.0.9",
  "httpx==0.27.2",
  "orjson==3.10.7",
  "loguru==0.7.2",
  "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "ruff>=0.6.8",
  "black>=24.8",
  "isort>=5.13",
  "mypy>=1.11",
  "types-requests"
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.setuptools.packages.find]
include = ["api*", "medparse*", "medparse_ifu*", "scripts*"]
exclude = [
  "tests*",
  "out*",
  "input*",
  "output*",
  "cache*",
  "schema*",
  "config*",
  "test_data*",
  "test_output*",
  "test_figures*",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["tests"]
